<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions</title>
    <style>
        body{
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .form_box{
            /* border: 1px solid red; */
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        fieldset{
            display: flex;
            flex-direction: column;
            text-align: center;
            align-items: center;
            row-gap: 10px;
        }
        input{
            width: 300px;
            padding: 10px;
            margin: 10px;
        }
        button{
            width: 100px;
            
        }
    </style>
</head>
<body>
    
    <div class="form_box">
        <form method="post" id="form">
            <fieldset>
                <label for="email">Sign In</label>
                <input type="email" name="email" id="email" placeholder="Enter Email">
                <input type="password" name="password" id="password" placeholder="Enter Password">
                <button type="submit" value="login" name="login" id="login">Log in</button>
            </fieldset>
        </form>
    </div>
    

    <script src="/js/functions.js"></script>

</body>
</html>
