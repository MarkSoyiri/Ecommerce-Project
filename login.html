<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login">
        <form action="" id="form">
            <fieldset>
                
                <a href="https://www.shopify.com/"><img class="logo" src="images/soscomn.png" width="100px" height="100px"></a>
    
                <h2>Log in</h2>
                <p class="p1">continue to soscom</p>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="">
                <input type="submit" id="cwe" value="continue with email">
                <input type="button" value="Sign in with passkey">
                <div class="orline">
                    <hr>
                    <div class="or" >
                        <p>or</p>
                    </div>
                </div>
                <div class="sub-buttons">
                 
                    <button><img src="/images/icons8-apple-logo-50.png" ></button>
                    <button><img src="/images/facebook.png" ></button>
                    <button><img src="/images/icons8-google-logo-48.png" ></button>

                </div>
                <p>New to soscom?<b class="getstart"> Get started</b><img class="arrow" src="images/icons8-right-50 (1).png" ></p>

                <div class="sub-nav">
                    <a href="">Help</a>
                    <a href="">Privacy</a>
                    <a href="">Terms</a>
                </div>
                
               
                
            </fieldset>
        </form>

    </div>
</body>
</html>
